<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Форум сообщества: обсуждения, вопросы и ответы. Работает прямо на GitHub Pages." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Форум</title>
    <script>
      // Тема применяется до первой отрисовки, чтобы не было «вспышки» белого.
      (function () {
        try {
          var saved = localStorage.getItem('forum:theme')
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
