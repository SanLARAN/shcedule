name: Deploy forum to GitHub Pages

on:
  push:
    # main — боевая публикация.
    # Рабочая ветка сессии тоже деплоится: пока Settings → Pages переключён на
    # «Deploy from a branch», GitHub публикует исходники ветки, и сайт ломается
    # после каждого пуша. Наш деплой идёт следом и возвращает собранный сайт.
    branches: [main, arena/01a0966a-shcedule]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: SPA fallback (deep links на GitHub Pages)
        run: cp dist/index.html dist/404.html

      # enablement: true — GitHub сам включит Pages, если он ещё не настроен.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Если Pages настроен на старый режим «deploy from a branch», шаг выше упадёт.
      # Пишем в summary точную инструкцию, чтобы не гадать, что делать.
      - name: Инструкция, если Pages не переключён
        if: failure()
        run: |
          {
            echo "### Не удалось подготовить Pages"
            echo ""
            echo "Скорее всего Pages ещё публикуется из ветки (legacy-режим), а для этого"
            echo "workflow нужен режим **GitHub Actions**."
            echo ""
            echo "1. Откройте **Settings → Pages**"
            echo "2. В блоке **Build and deployment → Source** выберите **GitHub Actions**"
            echo "3. Вернитесь в **Actions** и выберите **Re-run all jobs**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Пока Settings → Pages в режиме «Deploy from a branch», GitHub после каждого
      # пуша публикует ИСХОДНИКИ ветки (и страница становится пустой). Наша сборка
      # завершается позже, поэтому ждём и публикуем собранный сайт поверх.
      # После переключения Source на «GitHub Actions» задержка исчезнет сама.
      - name: Защита от legacy-режима Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          REPO="${{ github.repository }}"
          build_type=$(gh api "repos/$REPO/pages" --jq '.build_type' 2>/dev/null || echo unknown)
          if [ "$build_type" = "workflow" ]; then
            echo "Pages настроен на GitHub Actions — задержка не нужна."
            exit 0
          fi
          echo "Pages в режиме ветки (build_type=$build_type): ждём, пока GitHub опубликует исходники,"
          echo "чтобы наша сборка легла последней и сайт остался рабочим."
          sleep 90

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
