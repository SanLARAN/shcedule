name: Тема форума
description: Создать новую тему на форуме (появится на сайте автоматически)
title: ''
labels: ['forum']
body:
  - type: markdown
    attributes:
      value: |
        Заполните поля — тема сразу появится на сайте форума в выбранном разделе.
  - type: dropdown
    id: category
    attributes:
      label: Раздел
      description: Куда отнести тему
      options:
        - Общее
        - Помощь
        - Идеи
        - Проекты
        - Новости
        - Оффтоп
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Теги
      description: Через запятую, максимум 6 (необязательно)
      placeholder: дизайн, вопрос, javascript
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Поддерживается Markdown — списки, код, ссылки и картинки
      placeholder: Расскажите подробнее…
    validations:
      required: true
